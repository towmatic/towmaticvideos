<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0a0a0a;
        }
        #streaks-base,
        #streaks-erase,
        #streaks-lines,
        #streaks-glow,
        #streaks-pulse,
        #streaks-embers {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        #streaks-base img {
          display: block;
          width: 100%;
          height: 100%;
        }
        /* lines.png = the photo's orange light lines (truck masked out) on transparency. */
        #streaks-erase,
        #streaks-lines,
        #streaks-glow,
        #streaks-pulse {
          background: url("assets/images/lines.png") center / 100% 100% no-repeat;
        }
        /* Darken the photo's own lines (they sit on a dark road) so the swaying copy leaves no ghost. */
        #streaks-erase {
          filter: brightness(0);
          opacity: 0.88;
        }
        /* The lines, gently warped by #streaks-warp. Slightly dimmer than the photo between pulses. */
        #streaks-lines {
          filter: url(#streaks-warp);
          opacity: 0.82;
        }
        #streaks-glow {
          mix-blend-mode: screen;
          filter: url(#streaks-warp) blur(9px) saturate(1.2);
          opacity: 0.4;
        }
        /* Bright pulses that travel outward along the lines: the warped lines, brightened and shown
           only inside rings around the truck. --streaks-o is the ring offset in px. */
        #streaks-pulse {
          --streaks-o: 0;
          mix-blend-mode: screen;
          filter: url(#streaks-warp) brightness(1.9) saturate(1.15);
          -webkit-mask-image: repeating-radial-gradient(
            circle at 57% 62%,
            rgba(0, 0, 0, 0) calc(var(--streaks-o) * 1px),
            rgba(0, 0, 0, 1) calc(var(--streaks-o) * 1px + 40px),
            rgba(0, 0, 0, 0) calc(var(--streaks-o) * 1px + 100px),
            rgba(0, 0, 0, 0) calc(var(--streaks-o) * 1px + 320px)
          );
          mask-image: repeating-radial-gradient(
            circle at 57% 62%,
            rgba(0, 0, 0, 0) calc(var(--streaks-o) * 1px),
            rgba(0, 0, 0, 1) calc(var(--streaks-o) * 1px + 40px),
            rgba(0, 0, 0, 0) calc(var(--streaks-o) * 1px + 100px),
            rgba(0, 0, 0, 0) calc(var(--streaks-o) * 1px + 320px)
          );
        }
        .streaks-ember {
          position: absolute;
          left: 0;
          top: 0;
          border-radius: 50%;
          background: #ffb070;
          box-shadow: 0 0 6px 2px rgba(232, 114, 42, 0.75);
          opacity: 0;
        }
        #streaks-defs {
          position: absolute;
          width: 0;
          height: 0;
        }
      </style>

      <div id="root" data-composition-id="streaks" data-width="1920" data-height="1080">
        <svg id="streaks-defs" aria-hidden="true">
          <filter id="streaks-warp" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.0085" numOctaves="2" seed="11" result="streaks-noise" />
            <feDisplacementMap id="streaks-disp" in="SourceGraphic" in2="streaks-noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </svg>
        <div id="streaks-base"><img src="assets/images/hero.png" alt="" /></div>
        <div id="streaks-erase"></div>
        <div id="streaks-lines"></div>
        <div id="streaks-glow"></div>
        <div id="streaks-pulse"></div>
        <div id="streaks-embers"></div>
      </div>

      <script>
        (function () {
          var LOOP = 8; // seconds; every motion below completes a whole number of cycles per loop
          var PERIOD = 320; // px between pulse rings (matches the mask's repeat length)

          // Seeded PRNG so ember placement is identical on every render.
          var seed = 20261020;
          function rand() {
            seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
            var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          }

          var layer = document.getElementById("streaks-embers");
          var embers = [];
          for (var i = 0; i < 36; i++) {
            var el = document.createElement("div");
            el.className = "streaks-ember";
            var size = 2 + rand() * 3;
            el.style.width = size + "px";
            el.style.height = size + "px";
            layer.appendChild(el);
            embers.push({
              el: el,
              x0: 1920 * (0.38 + rand() * 0.6),
              y0: 1080 * (0.5 + rand() * 0.5),
              dx: 50 + rand() * 150,
              dy: -(90 + rand() * 220),
              phase: rand(),
              peak: 0.45 + rand() * 0.5,
            });
          }

          var pulse = document.getElementById("streaks-pulse");
          var glow = document.getElementById("streaks-glow");
          var disp = document.getElementById("streaks-disp");
          var clock = { t: 0 };

          function render() {
            var t = clock.t;
            var w = (2 * Math.PI * t) / LOOP;
            // Rings move outward exactly 3 periods per loop, so the first and last frames match.
            pulse.style.setProperty("--streaks-o", ((t / LOOP) * PERIOD * 3) % PERIOD);
            // Sway: the lines bend a little more and less, two slow cycles per loop.
            disp.setAttribute("scale", (9 + 6 * Math.sin(2 * w) + 2 * Math.sin(w + 1.3)).toFixed(3));
            // Glow breathes twice per loop.
            glow.style.opacity = (0.4 + 0.14 * Math.sin(2 * w)).toFixed(4);
            for (var k = 0; k < embers.length; k++) {
              var e = embers[k];
              var u = (t / LOOP + e.phase) % 1; // each ember lives one loop, offset by its phase
              var a = Math.pow(Math.sin(Math.PI * u), 1.5) * e.peak; // 0 at birth and death: seamless wrap
              e.el.style.opacity = a.toFixed(4);
              e.el.style.transform =
                "translate(" + (e.x0 + e.dx * u).toFixed(2) + "px," + (e.y0 + e.dy * u).toFixed(2) + "px)";
            }
          }

          var tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: LOOP, duration: LOOP, ease: "none", onUpdate: render }, 0);
          render();
          window.__timelines["streaks"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
