<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP is vendored locally so renders don't depend on a CDN. -->
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0f14;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #f5f7fa;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="bg-road"
        data-composition-id="bg-road"
        data-composition-src="compositions/bg-road.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="wordmark"
        data-composition-id="wordmark"
        data-composition-src="compositions/wordmark.html"
        data-start="0"
        data-duration="3.6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="features"
        data-composition-id="features"
        data-composition-src="compositions/features.html"
        data-start="3.6"
        data-duration="3.4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="tagline"
        data-composition-id="tagline"
        data-composition-src="compositions/tagline.html"
        data-start="7"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
